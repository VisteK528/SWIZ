- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- gz_topic_name: "/rgbd_camera/image"
  ros_topic_name: "/camera/color/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# RGB Image
- gz_topic_name: "/camera/image"
  ros_topic_name: "/camera/color/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Depth Image
- gz_topic_name: "/camera/depth_image"
  ros_topic_name: "/camera/depth/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera Info
- gz_topic_name: "/rgbd_camera/camera_info"
  ros_topic_name: "/camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- gz_topic_name: "/rgbd_camera/points"
  ros_topic_name: "/camera/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Camera TF is published by static_transform_publisher in ur_world.launch.py.
# Do NOT bridge /model/rgbd_camera/pose_static here — that plugin fires at
# the physics step rate and creates a second, conflicting TF source for
# rgbd_camera_link_optical, causing "jumped back in time" spam in every node.